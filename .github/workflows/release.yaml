name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Publish immutable version
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/benknab/backup-runner
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release image" >&2
            exit 1
          fi
          docker buildx build --platform linux/amd64 \
            --tag "$IMAGE:$version" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/image.json" --provenance=mode=max --push .
          digest=$(node -p "require(process.env.RUNNER_TEMP + '/image.json')['containerimage.digest']")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify anonymous pull and image contents
        env:
          IMAGE: ghcr.io/benknab/backup-runner
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          docker --config "$RUNNER_TEMP/anonymous-docker" pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker run --rm "$IMAGE@$DIGEST" --version)" = "backup-runner v$VERSION"
          docker run --rm --entrypoint sh "$IMAGE@$DIGEST" -ec \
            'test ! -d /app/tests; test ! -e /app/node_modules/@effect/vitest; test -f /usr/local/share/doc/backup-runner/THIRD_PARTY_NOTICES.md'
      - name: Record release digest and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release.md" <<EOF
          Image: \`ghcr.io/benknab/backup-runner:$VERSION@$DIGEST\`

          Source revision: \`$GITHUB_SHA\`

          Platform: Linux/amd64. CI verified unit tests, external-tool integrations,
          the production-image SQLite restore, and anonymous pulling of this digest.
          Proton transport uses simulated service responses in CI; perform an
          account-backed upload/download restore before enabling scheduled jobs.

          [Quickstart](https://github.com/benknab/backup-runner/blob/$GITHUB_REF_NAME/docs/quickstart.md)
          · [Restore guide](https://github.com/benknab/backup-runner/blob/$GITHUB_REF_NAME/docs/restores.md)
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release.md"
