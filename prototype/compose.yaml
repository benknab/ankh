name: backup-runner

services:
  proton-auth:
    build:
      context: .
    image: backup-runner:local
    entrypoint:
      - /app/proton-auth.sh
    environment:
      GNUPGHOME: /proton/gnupg
      HOME: /tmp
      PASSWORD_STORE_DIR: /proton/pass
      PROTON_DRIVE_CACHE_DIR: /proton/cache
      PROTON_DRIVE_CREDENTIALS_STORE: pass
      PROTON_DRIVE_LOG_LEVEL: WARNING
    volumes:
      - proton-state:/proton
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

volumes:
  proton-state:
    name: backup-proton-state
    external: true
