name: backup-runner

services:
  proton-auth:
    build:
      context: .
    image: backup-runner:local
    platform: linux/amd64
    command:
      - proton-login
    volumes:
      - proton-state:/proton
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

volumes:
  proton-state:
    name: backup-proton-state
    external: true
