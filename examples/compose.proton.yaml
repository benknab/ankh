services:
  backup:
    volumes:
      - type: bind
        source: ./sqlite-proton.job.json
        target: /job/backup.job.json
        read_only: true
        bind: { create_host_path: false }
      - proton-state:/proton
  proton-auth:
    image: ${ANKH_IMAGE:-ankh:local}
    platform: linux/amd64
    command: ["proton-login"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    # The sign-in URL carries the session handoff key; show it without storing it.
    logging: { driver: none }
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - proton-state:/proton
      # Supplies the optional proton-gpg-passphrase file.
      - type: bind
        source: ${PROTON_SECRETS_DIR:-${SECRETS_DIR:?Set SECRETS_DIR or PROTON_SECRETS_DIR}}
        target: /secrets
        read_only: true
        bind: { create_host_path: false }
volumes:
  proton-state:
    name: ${PROTON_STATE_VOLUME:-backup-proton-state}
    external: true
